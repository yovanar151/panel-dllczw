const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(B.s),iterations:B.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(B.i)},k,u(B.c));
if(save)sessionStorage.setItem('pk',pw);document.open();document.write(new TextDecoder().decode(pt));document.close();
setTimeout(()=>location.reload(),60000);}catch(e){sessionStorage.removeItem('pk');m.textContent='Clave incorrecta';}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value.trim(),true)};
const s=sessionStorage.getItem('pk');if(s)go(s,false);</script></body></html>
